[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse_pipeline"
version = "1.0.0"
description = "NSE Historical Market Data Pipeline & Daily EOD Ingestion Platform (2001-2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0.0",
    "PyMySQL>=1.1.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "APScheduler>=3.10.0",
    "pyyaml>=6.0.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.0",
    "openpyxl>=3.1.0"
]

[project.scripts]
nse-pipeline = "nse_pipeline.cli.commands:cli_app"

[tool.setuptools.packages.find]
where = ["src", "backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "backend/src"]
filterwarnings = [

    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

